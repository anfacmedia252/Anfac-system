<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#070c18">
    <title>ANFAC Media — Offline</title>
    <style>
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box; background: #070c18; color: #f1f5f9; font: 16px/1.6 Arial, sans-serif; text-align: center; }
        main { max-width: 28rem; padding: 2rem; border: 1px solid #1e293b; border-radius: 1.5rem; background: #11192c; }
        img { width: 5rem; height: 5rem; }
        h1 { margin: 1rem 0 .5rem; font-size: 1.4rem; }
        p { color: #94a3b8; }
        button { margin-top: 1rem; padding: .8rem 1.2rem; border: 0; border-radius: .75rem; background: #38bdf8; color: #070c18; font-weight: 700; }
    </style>
</head>
<body>
    <main>
        <img src="/pwa-icon.svg" alt="">
        <h1>You’re offline</h1>
        <p>Reconnect to the internet to sign in and access your ANFAC Media workspace.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
